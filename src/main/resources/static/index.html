<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cheetah Todos</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>Cheetah Todos</h1>

    <form id="sign-in">
      <span>Signed in as <strong id="user">anonymous</strong></span>
      <input id="name" placeholder="Your name" autocomplete="off" required>
      <button type="submit">Sign in</button>
      <button type="button" id="sign-out">Sign out</button>
    </form>

    <form id="new-todo">
      <input id="title" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <p id="error" role="alert"></p>
    <ul id="todos"></ul>
  </main>

  <script>
    const list = document.getElementById('todos');
    const error = document.getElementById('error');

    async function request(method, path, body) {
      const response = await fetch(path, {
        method,
        headers: body ? {'Content-Type': 'application/json'} : {},
        body: body ? JSON.stringify(body) : undefined
      });

      if (!response.ok) {
        const problem = await response.json();
        const details = (problem.violations || []).map(v => `${v.field} ${v.message}`);

        throw new Error(details.length ? details.join(', ') : problem.message);
      }

      return response.status === 204 ? null : response.json();
    }

    async function render() {
      document.getElementById('user').textContent = (await request('GET', '/session')).name;
      list.replaceChildren();

      for (const todo of await request('GET', '/todos')) {
        const item = document.createElement('li');
        item.className = todo.done ? 'done' : '';

        const title = document.createElement('span');
        title.textContent = `${todo.title} (${todo.createdBy})`;
        title.onclick = () => run(() => request('PATCH', `/todos/${todo.id}/toggle`));

        const remove = document.createElement('button');
        remove.textContent = 'Delete';
        remove.onclick = () => run(() => request('DELETE', `/todos/${todo.id}`));

        item.append(title, remove);
        list.append(item);
      }
    }

    async function run(action) {
      try {
        error.textContent = '';
        await action();
        await render();
      } catch (e) {
        error.textContent = e.message;
      }
    }

    document.getElementById('new-todo').onsubmit = event => {
      event.preventDefault();

      const input = document.getElementById('title');
      run(async () => {
        await request('POST', '/todos', {title: input.value});
        input.value = '';
      });
    };

    document.getElementById('sign-in').onsubmit = event => {
      event.preventDefault();

      const input = document.getElementById('name');
      run(async () => {
        await request('PUT', '/session', {name: input.value});
        input.value = '';
      });
    };

    document.getElementById('sign-out').onclick = () => run(() => request('DELETE', '/session'));

    run(() => Promise.resolve());
  </script>
</body>
</html>
